<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-paw"></i>
                <h2>Welcome Back!</h2>
                <p>Login to your Claudio Shop account</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="your.email@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#forgot-password" class="link" data-link>Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>

                <div class="form-divider">
                    <span>OR</span>
                </div>

                <div class="social-login">
                    <button type="button" class="btn btn-social btn-google">
                        <i class="fab fa-google"></i> Continue with Google
                    </button>
                    <button type="button" class="btn btn-social btn-facebook">
                        <i class="fab fa-facebook-f"></i> Continue with Facebook
                    </button>
                </div>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="#register" class="link" data-link>Register here</a></p>
                </div>
            </form>
        </div>

        <div class="auth-image">
            <img src="assets/images/auth-pets.png" alt="Happy Pets" onerror="this.src='https://via.placeholder.com/500x600/6C63FF/ffffff?text=Welcome+to+Claudio+Shop'">
            <div class="auth-image-overlay">
                <h3>Join Our Pet-Loving Community</h3>
                <p>Discover the best products for your beloved pets</p>
            </div>
        </div>
    </div>
</div>
